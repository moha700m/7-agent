services:
  - type: web
    name: tiktok-ai-live-cyber
    runtime: python
    plan: free
    region: frankfurt
    branch: tiktok-live-ai-render
    rootDir: tiktok-live-ai-render
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 0 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
