<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE Host Audio Player</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}#status{position:fixed;left:8px;bottom:8px;font:12px system-ui;color:rgba(255,255,255,.16)}audio{display:none}#controls{display:none;background:#131824;color:white;padding:12px;font:14px system-ui;border-radius:12px}#controls input{max-width:160px}button{padding:8px}</style></head>
<body><audio id="audio" autoplay playsinline preload="auto"></audio><div id="status" role="status">جاري الاتصال…</div>
<div id="controls"><button id="unlock">تفعيل الصوت</button><label>Volume <input id="volume" type="range" min="0" max="1" step=".05" value="1"></label><label><input id="mute" type="checkbox">Mute</label><span id="character"></span></div>
<script>
const audio=document.getElementById("audio"),status=document.getElementById("status");
const params=new URLSearchParams(location.hash.slice(1));
let capability=params.get("token")||sessionStorage.getItem("live-player-capability")||"";
if(capability){sessionStorage.setItem("live-player-capability",capability);history.replaceState(null,"",location.pathname+location.search);}
async function ensureCapability(){
  if(capability)return capability;
  const r=await fetch("/api/backend?path=player_bootstrap",{cache:"no-store",signal:AbortSignal.timeout(4000)});
  if(!r.ok)throw new Error("تعذر تفعيل مشغل LIVE");
  const j=await r.json();capability=j.token||"";
  if(!capability)throw new Error("تعذر تفعيل مشغل LIVE");
  sessionStorage.setItem("live-player-capability",capability);return capability;
}
const playerId=crypto.randomUUID(),queue=[],seen=new Set();
let busy=false,current=null,lastId=0,boot="",epoch=null,active=false,finishedId=null,failed=false;
let watchdog=null,retryTimer=null,streamTimer=null,finishTimer=null,playbackChanges={};
let pcmCtx=null,pcmGain=null,pcmSources=[];
if(new URLSearchParams(location.search).has("controls"))document.getElementById("controls").style.display="block";

async function api(path,body=null,query={}){
  if(["player/heartbeat","audio/events","audio/chunks"].includes(path))await ensureCapability();
  const search=new URLSearchParams({path,...query});const headers={"cache-control":"no-cache"};
  if(capability)headers["x-player-token"]=capability;
  const init={method:body===null?"GET":"POST",headers,cache:"no-store",signal:AbortSignal.timeout(5000)};
  if(body!==null){headers["content-type"]="application/json";init.body=JSON.stringify(body);}
  const r=await fetch("/api/backend?"+search,init);
  if(!r.ok)throw new Error(r.status===401?"احصل على رابط المشغل من لوحة التحكم":"HTTP "+r.status);
  return r.json();
}
function stopPcm(){
  clearTimeout(streamTimer);clearTimeout(finishTimer);
  for(const s of pcmSources){try{s.stop()}catch{}}
  pcmSources=[];
}
function resetAudio(){
  clearTimeout(retryTimer);clearTimeout(watchdog);stopPcm();queue.length=0;
  if(current?.url)URL.revokeObjectURL(current.url);current=null;busy=false;
  audio.onended=audio.onerror=null;audio.pause();audio.removeAttribute("src");audio.load();
}
function remember(id){
  seen.add(id);while(seen.size>200)seen.delete(seen.values().next().value);
  try{sessionStorage.setItem("live-played",JSON.stringify({boot,ids:[...seen]}));}catch{}
}
function finish(item,error=false){
  if(current!==item)return;
  clearTimeout(retryTimer);clearTimeout(watchdog);clearTimeout(streamTimer);clearTimeout(finishTimer);
  audio.onended=audio.onerror=null;audio.pause();if(item.url)URL.revokeObjectURL(item.url);
  finishedId=item.id;failed=error;current=null;busy=false;pcmSources=[];playNext();
}
async function tryPlay(item){
  if(current!==item||!active)return;
  try{await audio.play();status.textContent="LIVE • playing • "+(item.character||"");}
  catch{retry(item);}
}
function retry(item){
  if(current!==item||item.retryPending)return;
  if(item.attempts>=3){status.textContent="تعذر تشغيل الصوت — فعّل التشغيل التلقائي";finish(item,true);return;}
  item.attempts++;item.retryPending=true;
  retryTimer=setTimeout(()=>{if(current!==item)return;item.retryPending=false;audio.load();tryPlay(item);},700*item.attempts);
}
function playFile(item){
  busy=true;current=item;
  try{
    const binary=atob(item.audio_b64),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));item.audio_b64="";
    item.url=URL.createObjectURL(new Blob([bytes],{type:item.mime||"audio/mpeg"}));item.attempts=0;
    audio.src=item.url;audio.onended=()=>finish(item);audio.onerror=()=>retry(item);
    watchdog=setTimeout(()=>finish(item,true),60000);document.getElementById("character").textContent=item.character||"";tryPlay(item);
  }catch{finish(item,true);}
}
async function ensurePcm(){
  if(!pcmCtx){
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)throw new Error("WebAudio غير مدعوم");
    pcmCtx=new C();pcmGain=pcmCtx.createGain();pcmGain.connect(pcmCtx.destination);
  }
  if(pcmCtx.state==="suspended")await pcmCtx.resume();
  pcmGain.gain.value=audio.muted?0:audio.volume;
  return pcmCtx;
}
function schedulePcm(b64,sampleRate,item){
  const binary=atob(b64),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  const len=Math.floor(bytes.length/2);if(!len)return;
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),floats=new Float32Array(len);
  for(let i=0;i<len;i++)floats[i]=Math.max(-1,Math.min(1,view.getInt16(i*2,true)/32768));
  const buf=pcmCtx.createBuffer(1,len,Number(sampleRate||24000));buf.copyToChannel(floats,0);
  const src=pcmCtx.createBufferSource();src.buffer=buf;src.connect(pcmGain);
  const start=Math.max(item.scheduledEnd||0,pcmCtx.currentTime+.06);src.start(start);
  item.scheduledEnd=start+buf.duration;pcmSources.push(src);
}
async function pollChunks(item){
  if(current!==item||!active)return;
  try{
    await ensurePcm();
    const d=await api("audio/chunks",null,{audio_id:String(item.id),since:String(item.streamSeq||0),player_id:playerId});
    if(current!==item)return;
    if(!d.active)throw new Error("مشغل آخر مسؤول عن الصوت");
    for(const ch of d.chunks||[]){if(ch.seq>(item.streamSeq||0)){schedulePcm(ch.audio_b64,d.sample_rate||item.sample_rate,item);item.streamSeq=ch.seq;}}
    status.textContent="LIVE • realtime • "+(item.character||"");
    if(d.failed){item.streamFailed=true;}
    if(d.done && (item.streamSeq||0)>=Number(d.latest_seq||0)){
      const ms=Math.max(30,((item.scheduledEnd||pcmCtx.currentTime)-pcmCtx.currentTime)*1000+80);
      finishTimer=setTimeout(()=>finish(item,!!item.streamFailed),ms);return;
    }
    streamTimer=setTimeout(()=>pollChunks(item),80);
  }catch(e){status.textContent="LIVE • streaming error";finish(item,true);}
}
async function playStream(item){
  busy=true;current=item;item.streamSeq=0;item.scheduledEnd=0;item.streamFailed=false;
  document.getElementById("character").textContent=item.character||"";
  try{await ensurePcm();pollChunks(item);watchdog=setTimeout(()=>finish(item,true),60000);}
  catch{finish(item,true);}
}
function playNext(){
  if(busy||!active||!queue.length||audio.muted)return;
  const item=queue.shift();
  if(item.stream)playStream(item);else playFile(item);
}
async function poll(){
  try{
    const sentFinished=finishedId;
    const hb=await api("player/heartbeat",{player_id:playerId,boot_id:boot,busy,queue_size:queue.length,current_id:current?.id||null,finished_id:sentFinished,failed,pcm_streaming:true,...playbackChanges});
    playbackChanges={};if(sentFinished===finishedId){finishedId=null;failed=false;}
    active=hb.active;
    if(!active){resetAudio();status.textContent="مشغل آخر مسؤول عن صوت البث";return;}
    if(boot&&boot!==hb.boot_id){lastId=0;seen.clear();resetAudio();}
    if(epoch!==null&&epoch!==hb.epoch)resetAudio();epoch=hb.epoch;
    if(boot!==hb.boot_id){boot=hb.boot_id;try{const old=JSON.parse(sessionStorage.getItem("live-played")||"{}");if(old.boot===boot)(old.ids||[]).forEach(id=>seen.add(id));}catch{}}
    audio.muted=!!hb.muted;audio.volume=Number(hb.volume??1);if(pcmGain)pcmGain.gain.value=audio.muted?0:audio.volume;
    document.getElementById("volume").value=audio.volume;document.getElementById("mute").checked=audio.muted;
    const data=await api("audio/events",null,{since:String(lastId),player_id:playerId});
    if(data.boot_id!==boot||data.epoch!==epoch){resetAudio();return;}
    for(const row of data.events||[]){
      lastId=Math.max(lastId,row.id);
      if(seen.has(row.id)){if(!current||current.id!==row.id)finishedId=row.id;continue;}
      remember(row.id);
      if(row.stream||row.audio_b64)queue.push(row);
    }
    if(!busy)status.textContent=hb.running?(hb.streaming?"LIVE • realtime ready":"LIVE • ready"):"الوكيل متوقف";
    playNext();
  }catch(e){
    if(String(e.message||"").includes("401")||String(e.message||"").includes("احصل على رابط المشغل")){
      capability="";sessionStorage.removeItem("live-player-capability");
    }
    active=false;if(current){finishedId=current.id;failed=true;}resetAudio();status.textContent="LIVE • "+e.message;
  }finally{setTimeout(poll,500);}
}
document.getElementById("unlock").onclick=async()=>{try{await ensurePcm();if(current?.stream)pollChunks(current);else if(current)tryPlay(current);else playNext();}catch{}};
document.getElementById("volume").oninput=e=>{audio.volume=Number(e.target.value);if(pcmGain)pcmGain.gain.value=audio.muted?0:audio.volume;playbackChanges.volume=audio.volume;};
document.getElementById("mute").onchange=e=>{audio.muted=e.target.checked;if(pcmGain)pcmGain.gain.value=audio.muted?0:audio.volume;playbackChanges.muted=audio.muted;};
window.addEventListener("beforeunload",resetAudio);poll();
</script></body></html>
