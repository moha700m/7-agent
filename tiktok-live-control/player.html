<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber LIVE Audio Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
#status{position:fixed;left:8px;bottom:8px;font:12px system-ui;color:rgba(255,255,255,.08);user-select:none}
</style>
</head>
<body>
<div id="status">Cyber Audio</div>
<script>
let lastId=0;
let initialized=false;
const q=[];
let busy=false;

async function api(path, extra=""){
  const r=await fetch("/api/backend?path="+encodeURIComponent(path)+(extra||""),{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function enqueue(src){q.push(src);playNext()}
async function playNext(){
  if(busy||!q.length)return;
  busy=true;
  const a=new Audio(q.shift());
  a.volume=1;
  const done=()=>{busy=false;playNext()};
  a.onended=done;
  a.onerror=done;
  try{await a.play()}catch{busy=false}
}
async function poll(){
  try{
    const j=await api("events","&since="+lastId);
    const rows=j.events||[];
    if(!initialized){
      for(const e of rows) lastId=Math.max(lastId,e.id||0);
      initialized=true;
      return;
    }
    for(const e of rows){
      lastId=Math.max(lastId,e.id||0);
      if(e.audio_b64){
        enqueue("data:"+(e.mime||"audio/mpeg")+";base64,"+e.audio_b64);
      }
    }
  }catch{}
}
poll();
setInterval(poll,700);
</script>
</body>
</html>
