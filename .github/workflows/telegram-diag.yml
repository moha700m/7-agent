name: Telegram External E2E Audit
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run external E2E audit
        shell: bash
        run: |
          set +e
          BASE='https://api-v2.appdeploy.ai/app/english-level-3-teacher-okjkpp'
          OUT='telegram-diag-result.txt'
          : > "$OUT"
          echo '=== ENSURE WEBHOOK ===' >> "$OUT"
          curl --silent --show-error --location --max-time 20 -X POST --write-out '\nHTTP_STATUS=%{http_code}\n' "$BASE/api/telegram/ensure" >> "$OUT" 2>&1
          sleep 12
          echo '=== DIAG AFTER DELIVERY ===' >> "$OUT"
          curl --silent --show-error --location --max-time 20 --write-out '\nHTTP_STATUS=%{http_code}\n' "$BASE/api/telegram/diag" >> "$OUT" 2>&1
          echo '=== OPENROUTER AUDIT ===' >> "$OUT"
          curl --silent --show-error --location --max-time 25 -X POST --write-out '\nHTTP_STATUS=%{http_code}\n' "$BASE/api/telegram/audit-ai/7f290d0faf9038160fe2a3bbc4a53a12" >> "$OUT" 2>&1
          echo '=== ELEVENLABS + TELEGRAM VOICE AUDIT ===' >> "$OUT"
          curl --silent --show-error --location --max-time 35 -X POST --write-out '\nHTTP_STATUS=%{http_code}\n' "$BASE/api/telegram/audit-voice/7f290d0faf9038160fe2a3bbc4a53a12" >> "$OUT" 2>&1
          sleep 2
          echo '=== FINAL DIAG ===' >> "$OUT"
          curl --silent --show-error --location --max-time 20 --write-out '\nHTTP_STATUS=%{http_code}\n' "$BASE/api/telegram/diag" >> "$OUT" 2>&1
      - name: Commit audit result
        shell: bash
        run: |
          git config user.name 'telegram-diag-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add telegram-diag-result.txt
          git diff --cached --quiet || git commit -m 'test: save Telegram E2E audit result'
          git push
# audit rerun 2026-08-23T10:41+03:00
